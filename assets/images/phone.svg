<svg xmlns="http://www.w3.org/2000/svg" width="240" height="480" viewBox="0 0 240 480" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- 165deg gradient: teal at top, deep teal at bottom -->
    <linearGradient id="screen" x1="0.37" y1="0" x2="0.63" y2="1">
      <stop offset="0" stop-color="#1F6F78"/>
      <stop offset="1" stop-color="#163E42"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="0" y="0" width="240" height="480" rx="34" fill="#14181F"/>

  <!-- Screen -->
  <rect x="10" y="10" width="220" height="460" rx="26" fill="url(#screen)"/>

  <!-- Notch -->
  <rect x="84" y="10" width="72" height="18" rx="9" fill="#14181F"/>

  <!-- UI card -->
  <rect x="24" y="58" width="192" height="58" rx="12" fill="#FFFFFF" fill-opacity="0.12"/>
  <rect x="39" y="76" width="161" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.5"/>
  <rect x="39" y="92" width="88" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- Floating action button -->
  <rect x="168" y="400" width="44" height="44" rx="14" fill="#F2A93B"/>
  <path d="M190 415 V429 M183 422 H197" stroke="#14181F" stroke-width="2.5" stroke-linecap="round"/>
</svg>
